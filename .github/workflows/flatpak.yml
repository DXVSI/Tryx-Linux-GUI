---
name: Experimental Flatpak

on:
  pull_request:
  push:
    branches: [development, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Flatpak / Qt 6.11 / x86_64
    # Ubuntu 24.04's AppArmor userns restriction blocks non-root bwrap loopback
    # setup inside this container. Keep isolation on a supported 22.04 host;
    # application libraries still come from the pinned container and KDE SDK.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # Nested bubblewrap requires this on the disposable GitHub-hosted runner.
    # Do not move this untrusted-source build onto a persistent self-hosted host.
    container:
      image: ghcr.io/flathub-infra/flatpak-builder-lint@sha256:1dd5df1747ba8691a456a05074627b889fe2fd4487e24151b7face37b6434322
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tools and prepare an unprivileged builder
        run: |
          set -euo pipefail
          flatpak --version
          flatpak-builder --version
          flatpak_version=$(flatpak --version)
          flatpak_version=${flatpak_version#Flatpak }
          [[ "$flatpak_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]
          test "$(printf '%s\n' 1.15.11 "$flatpak_version" | sort -V | head -n 1)" = 1.15.11
          # The pinned SDK image has only root and no useradd/runuser tools.
          # Match its initial accounts before adding our CI-only identity.
          test "$(getent passwd)" = 'root:x:0:0:root:/root:/bin/bash'
          test "$(getent group)" = 'root:x:0:'
          install -m644 .github/flatpak-ci.passwd /etc/passwd
          install -m644 .github/flatpak-ci.group /etc/group
          install -d -m755 -o 1001 -g 1001 /home/flatbld build build/flatpak-state

      - name: Cache unprivileged builder state
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/flatpak-state
          key: flatpak-nonroot-x86_64-kde-6.11-${{ hashFiles('packaging/flatpak/*.yml') }}-${{ github.sha }}
          restore-keys: |
            flatpak-nonroot-x86_64-kde-6.11-${{ hashFiles('packaging/flatpak/*.yml') }}-

      - name: Build and test experimental bundle
        run: |
          set -euo pipefail
          # Drop UID and capabilities before Flatpak creates its one-UID sandbox.
          # The CLI intentionally rejects root-owned session buses.
          # Variables in the command are expanded by the unprivileged child shell.
          # shellcheck disable=SC2016
          capsh --drop=all --user=flatbld --inh= --noamb -- -c '
            set -eu
            test "$(id -u)" -eq 1001
            flatpak remote-add --user --if-not-exists flathub \
              https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak-builder --user --install-deps-from=flathub \
              --disable-rofiles-fuse --ccache --jobs=2 \
              --state-dir=build/flatpak-state --repo=build/flatpak-repo \
              --subject="Built from $GITHUB_SHA" \
              --default-branch=experimental --arch=x86_64 \
              build/flatpak packaging/flatpak/io.github.dxvsi.tryx_panorama_manager.yml
            flatpak build-bundle \
              --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
              --arch=x86_64 build/flatpak-repo \
              build/tryx-panorama-manager-x86_64.flatpak \
              io.github.dxvsi.tryx_panorama_manager experimental
          '

      - name: Upload test bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tryx-flatpak-x86_64-${{ github.run_id }}
          path: build/tryx-panorama-manager-x86_64.flatpak
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
