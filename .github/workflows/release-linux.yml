---
name: Draft Linux release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: draft-linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-source:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, version, and production ancestry
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must have the exact form vX.Y.Z" >&2
            exit 1
          fi

          packaging/scripts/check-release-contract.sh "$GITHUB_REF_NAME"
          version=$(tr -d '\r\n' < VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          git fetch --no-tags --prune origin \
            '+refs/heads/production:refs/remotes/origin/production'
          tagged_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          test "$tagged_commit" = "$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$tagged_commit" origin/production; then
            echo "tagged commit is not in the production branch history" >&2
            exit 1
          fi

  build-packages:
    name: Rebuild release packages
    needs: verify-release-source
    permissions:
      contents: read
    uses: ./.github/workflows/package-linux.yml

  draft-release:
    name: Attest assets and create draft
    needs:
      - verify-release-source
      - build-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tryx-*-${{ github.run_id }}
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify-release-source.outputs.version }}"

          mapfile -t rpm_files < <(
            find release-assets -maxdepth 1 -type f \
              -name "tryx-panorama-manager-$version-1.fc*.x86_64.rpm" |
              LC_ALL=C sort
          )
          mapfile -t deb_files < <(
            find release-assets -maxdepth 1 -type f \
              -name "tryx-panorama-manager_${version}-1_amd64.deb" |
              LC_ALL=C sort
          )
          mapfile -t arch_files < <(
            find release-assets -maxdepth 1 -type f \
              -name "tryx-panorama-manager-$version-1-x86_64.pkg.tar.zst" |
              LC_ALL=C sort
          )
          mapfile -t source_files < <(
            find release-assets -maxdepth 1 -type f \
              -name "tryx-panorama-manager-$version.tar.xz" |
              LC_ALL=C sort
          )

          test "${#rpm_files[@]}" -eq 2
          test "${#deb_files[@]}" -eq 1
          test "${#arch_files[@]}" -eq 1
          test "${#source_files[@]}" -eq 1
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 5

          (
            cd release-assets
            find . -maxdepth 1 -type f -printf '%P\0' |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )
          test "$(wc -l < release-assets/SHA256SUMS)" -eq 5
          (
            cd release-assets
            sha256sum --check SHA256SUMS
          )

      - name: Refuse to replace an existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "a GitHub Release already exists for $RELEASE_TAG; refusing to overwrite it" >&2
            exit 1
          fi

      - name: Attest release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            release-assets/*.rpm
            release-assets/*.deb
            release-assets/*.pkg.tar.zst
            release-assets/*.tar.xz
            release-assets/SHA256SUMS

      - name: Preserve aggregated release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-assets-${{ github.run_id }}
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.verify-release-source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "a GitHub Release already exists for $RELEASE_TAG; refusing to overwrite it" >&2
            exit 1
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf '# TRYX Panorama Manager %s\n\n' "$RELEASE_VERSION"
            printf 'Native packages for Fedora 43/44, Ubuntu 24.04 and Linux Mint 22, and current Arch Linux.\n\n'
            printf 'This release is intentionally a draft. Publish it only after the documented hardware smoke tests pass on a physical PASE device.\n'
          } > "$notes_file"

          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --draft \
            --title "TRYX Panorama Manager $RELEASE_VERSION" \
            --notes-file "$notes_file" \
            --verify-tag

          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
