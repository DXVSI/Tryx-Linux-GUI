syntax = "proto3";

package panorama.wire.v1;

message MediaEntry {
  string file_path = 1;
  string file_ext = 2;
  uint32 file_size = 3;
  bool read_only = 4;
}

message PowerOnConfiguration {
  string media_file = 1;
}

message StandbyConfiguration {
  bool enable = 1;
  string media_file = 2;
}

message DisplayConfiguration {
  bool backlight_enable = 1;
  uint32 backlight_brightness = 2;
  bool mirror = 3;
  uint32 ui_rotation = 4;
  uint32 media_rotation = 5;
}

message WorkConfiguration {
  enum MediaMode {
    MEDIA_SINGLE = 0;
    MEDIA_DUAL = 1;
    MEDIA_KALEIDOSCOPE = 2;
  }

  // LOOP_ALL and LOOP_RANDOM cycle through the user media. KANALI 2.6.0 adds
  // the preset counterparts; it never writes them, but a device configured
  // by other software may report them. The host only reads them.
  enum LoopMode {
    LOOP_SINGLE = 0;
    LOOP_ALL = 1;
    LOOP_RANDOM = 2;
    LOOP_PRESET_ALL = 3;
    LOOP_PRESET_RANDOM = 4;
  }

  enum KaleidoscopeSource {
    KALEIDOSCOPE_LEFT = 0;
    KALEIDOSCOPE_RIGHT = 1;
  }

  MediaMode media_mode = 1;
  LoopMode loop_mode = 2;
  string single_mode_media_file = 3;
  string dual_mode_left_media_file = 4;
  string dual_mode_right_media_file = 5;
  string kaleidoscope_media_file = 6;
  KaleidoscopeSource kaleidoscope_source = 7;
}

message FilterConfiguration {
  enum Mode {
    FILTER_SINGLE = 0;
    FILTER_DUAL = 1;
  }

  bool enable = 1;
  string filter_file = 2;
  uint32 alpha = 3;
  string dual_mode_left_file = 4;
  string dual_mode_right_file = 5;
  uint32 dual_mode_left_alpha = 6;
  uint32 dual_mode_right_alpha = 7;
  Mode filter_mode = 8;
}

message RgbColor {
  uint32 r = 1;
  uint32 g = 2;
  uint32 b = 3;
}

// Decoration light of the HOLO (KANALI 2.6.0 LightConfigPb). The host never
// changes it; a read-modify-write of UserConfiguration carries it back as
// the device reported it.
message LightConfiguration {
  enum Effect {
    LIGHT_EFFECT_BATTERY_FLOW = 0;
    LIGHT_EFFECT_FLOW = 1;
    LIGHT_EFFECT_NEON = 2;
    LIGHT_EFFECT_SOLID = 3;
    LIGHT_EFFECT_BREATH = 4;
    LIGHT_EFFECT_INDICATOR = 5;
    LIGHT_EFFECT_OFF = 6;
  }

  enum ControlMode {
    LIGHT_CONTROL_I2C = 0;
    LIGHT_CONTROL_ARGB_SYNC = 1;
  }

  bool enable = 1;
  uint32 brightness = 2;
  Effect effect = 3;
  RgbColor color = 4;
  uint32 speed = 5;
  ControlMode control_mode = 10;
}

message UserConfiguration {
  PowerOnConfiguration poweron_config = 1;
  StandbyConfiguration standby_config = 2;
  WorkConfiguration work_config = 3;
  FilterConfiguration filter_config = 4;
  DisplayConfiguration display_config = 5;
  LightConfiguration light_config = 6;
}

message MediaCatalog {
  repeated MediaEntry media_file_list = 1;
  repeated MediaEntry preset_file_list = 2;
}

message DeviceDisplayPanelSummary {
  enum Kind {
    DISPLAY_PANEL_LCD = 0;
    DISPLAY_PANEL_OLED = 1;
  }

  optional Kind kind = 1;
}

// Where the device keeps its files (vendor StoragePb inside BoardParamPb).
// Read for diagnostics only.
message DeviceStorageSummary {
  optional string mount_base = 2;
  optional string data_folder = 3;
}

message DeviceBoardSummary {
  DeviceStorageSummary storage = 1;
  DeviceDisplayPanelSummary display_panel = 2;
}

message DeviceVideoDecoderSummary {
  optional uint32 width = 1;
  optional uint32 height = 2;
}

message DeviceVideoOutputSummary {
  optional uint32 width = 1;
  optional uint32 height = 2;
}

message DeviceRuntimeBehaviorSummary {
  optional bool usb_auto_keepalive = 1;
}

// Minimal project-owned, read-only projection used by B10. Unknown peer fields
// remain in protobuf's unknown-field set and are never exposed above the
// protocol layer.
message SystemConfiguration {
  optional string reported_product = 1;
  // Device-side default media for power-on and standby (vendor SysConfigPb
  // fields 2 and 3). Turris writes them back unchanged in its user
  // configuration instead of guessing profile defaults.
  optional string poweron_media_file = 2;
  optional string standby_media_file = 3;
  DeviceBoardSummary board_summary = 9;
  // Vendor VDecParamPb: the decoder frame size the firmware configures.
  DeviceVideoDecoderSummary video_decoder = 10;
  DeviceVideoOutputSummary video_output = 12;
  DeviceRuntimeBehaviorSummary runtime_behavior = 14;
}
