syntax = "proto3";

package panorama.wire.v1;

message MediaEntry {
  string file_path = 1;
  string file_ext = 2;
  uint32 file_size = 3;
  bool read_only = 4;
}

message PowerOnConfiguration {
  string media_file = 1;
}

message StandbyConfiguration {
  bool enable = 1;
  string media_file = 2;
}

message DisplayConfiguration {
  bool backlight_enable = 1;
  uint32 backlight_brightness = 2;
  bool mirror = 3;
  uint32 ui_rotation = 4;
  uint32 media_rotation = 5;
}

message WorkConfiguration {
  enum MediaMode {
    MEDIA_SINGLE = 0;
    MEDIA_DUAL = 1;
    MEDIA_KALEIDOSCOPE = 2;
  }

  enum LoopMode {
    LOOP_SINGLE = 0;
    LOOP_ALL = 1;
    LOOP_RANDOM = 2;
  }

  enum KaleidoscopeSource {
    KALEIDOSCOPE_LEFT = 0;
    KALEIDOSCOPE_RIGHT = 1;
  }

  MediaMode media_mode = 1;
  LoopMode loop_mode = 2;
  string single_mode_media_file = 3;
  string dual_mode_left_media_file = 4;
  string dual_mode_right_media_file = 5;
  string kaleidoscope_media_file = 6;
  KaleidoscopeSource kaleidoscope_source = 7;
}

message FilterConfiguration {
  enum Mode {
    FILTER_SINGLE = 0;
    FILTER_DUAL = 1;
  }

  bool enable = 1;
  string filter_file = 2;
  uint32 alpha = 3;
  string dual_mode_left_file = 4;
  string dual_mode_right_file = 5;
  uint32 dual_mode_left_alpha = 6;
  uint32 dual_mode_right_alpha = 7;
  Mode filter_mode = 8;
}

message UserConfiguration {
  PowerOnConfiguration poweron_config = 1;
  StandbyConfiguration standby_config = 2;
  WorkConfiguration work_config = 3;
  FilterConfiguration filter_config = 4;
  DisplayConfiguration display_config = 5;
}

message MediaCatalog {
  repeated MediaEntry media_file_list = 1;
  repeated MediaEntry preset_file_list = 2;
}

// The runtime only needs presence of this response body. Fields sent by a
// newer peer remain in protobuf's unknown-field set.
message SystemConfiguration {
}
